# ตัวอย่างค่าสำหรับ nginx ที่เป็น load balancer แยกบน VM
# แก้ IP ใน upstream ให้เป็น INTERNAL-IP ของ worker node ของคุณ (kubectl get nodes -o wide)
# พอร์ต 31080 คือ NodePort ที่ล็อกไว้ตาม README (หัวข้อ "กรณีมี external load balancer")
upstream k8s_ingress {
    server 192.168.214.136:31080;
    server 192.168.214.137:31080;
}

server {
    listen 80;
    server_name www.iam-367.com admin.iam-367.com;

    location / {
        proxy_pass http://k8s_ingress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream-Addr $upstream_addr always;
    }
}
