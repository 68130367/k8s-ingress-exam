apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-367-data
  labels:
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-367
  labels: &labels
    app: portal-367
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portal-367
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: student-info
          env:
            - name: DATA_FILE
              value: /data/portal.json
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: photo, mountPath: /photo, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: code
          configMap: { name: portal-367-code }
        - name: photo
          configMap: { name: portal-367-photo }
        - name: data
          persistentVolumeClaim: { claimName: portal-367-data }
---
apiVersion: v1
kind: Service
metadata:
  name: portal-367
  labels:
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  type: ClusterIP
  selector:
    app: portal-367
  ports:
    - port: 80
      targetPort: 8080
