apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-367
  labels: &labels
    app: api-367
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-367
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
      volumes:
        - name: code
          configMap: { name: api-367-code }
---
apiVersion: v1
kind: Service
metadata:
  name: api-367
  labels:
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  type: ClusterIP
  selector:
    app: api-367
  ports:
    - port: 80
      targetPort: 8080
