---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-www
  labels:
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  ingressClassName: nginx
  rules:
    - host: www.iam-367.com
      http:
        paths:
          - path: /research
            pathType: Prefix
            backend:
              service:
                name: app-research
                port:
                  number: 80
          - path: /api-367
            pathType: Prefix
            backend:
              service:
                name: api-367
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-367
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-admin
  labels:
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  ingressClassName: nginx
  rules:
    - host: admin.iam-367.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-367
                port:
                  number: 80
