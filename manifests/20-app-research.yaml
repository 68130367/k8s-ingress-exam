apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-research-data
  labels:
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-research
  labels: &labels
    app: app-research
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-research
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: code
          configMap: { name: app-research-code }
        - name: seed
          configMap: { name: app-research-seed }
        - name: data
          persistentVolumeClaim: { claimName: app-research-data }
---
apiVersion: v1
kind: Service
metadata:
  name: app-research
  labels:
    app.kubernetes.io/part-of: k8s-ingress-exam
spec:
  type: ClusterIP
  selector:
    app: app-research
  ports:
    - port: 80
      targetPort: 8080
